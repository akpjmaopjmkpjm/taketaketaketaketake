version: 0.0
os: windows
files:
  - source: \
    destination: C:\deploy
file_exists_behavior: OVERWRITE
hooks:
  # 💡 前回の古いファイルがなくてもエラーを無視して確実に進める設定
  ApplicationStop:
    - location: s3_transfer.ps1
      timeout: 30
      allow_lifecycle_event_errors: true

  # 💡 サーバーに最新の s3_transfer.ps1 が届いた後、ここで安全に実行する
  ApplicationStart:
    - location: s3_transfer.ps1
      timeout: 300