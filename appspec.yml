version: 0.0
os: windows
files:
  - source: \
    destination: C:\deploy
file_exists_behavior: OVERWRITE
hooks:
  # 🔴 エラーや応答なしになっても、10秒で強制的に切り上げて次へ進ませます
  ApplicationStop:
    - location: s3_transfer.ps1
      timeout: 10
      allow_lifecycle_event_errors: true

  # 🔴 ここも念のためエラー無視を入れます
  ApplicationStart:
    - location: s3_transfer.ps1
      timeout: 300
      allow_lifecycle_event_errors: true