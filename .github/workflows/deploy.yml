name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. AWSへOIDCでログイン
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-1
          role-to-assume: arn:aws:iam::568601941391:role/GitHubActionsDeployRole

      # 2. 確実にzipに固めて、直球でS3（20260616-resi）にアップロードするsuuu
      - name: Zip and Upload to S3
        run: |
          zip -r deploy.zip . -x "*.git*"
          aws s3 cp deploy.zip s3://20260616-resi/deploy.zip

      # 3. アップロードしたzipを指定して、CodeDeployを実行する
      - name: Trigger CodeDeploy to EC2
        run: |
          aws deploy create-deployment \
            --application-name deploy-serverless \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name deploy-group \
            --s3-location bucket=20260616-resi,key=deploy.zip,bundleType=zip