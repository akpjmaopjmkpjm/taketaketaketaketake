name: Deploy Lambda via CodeDeploy

on:
  push:
    branches:
      - main # 💡 トリガーにするブランチ名

permissions:
  id-token: write # 💡 OIDC認証を使うために必須の権限
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコード（script.pyなど）を取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. AWS への認証（アクセスキーなしの OIDC 方式）
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::568601941391:role/20260615deploy
          aws-region: ap-northeast-1

      # 3. script.py を zip 化して S3 バケットにアップロード
      # ※ lambda-resive が監視している S3 バケット名に書き換えてくださいok
      - name: Upload Zip to S3
        run: |
          zip -j function.zip script.py
          aws s3 cp function.zip s3://lambda-resive/function.zip