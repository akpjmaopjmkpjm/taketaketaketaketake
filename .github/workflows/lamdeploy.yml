name: Deploy Lambda via CodeDeploy

on:
  push:
    branches:
      - main # 💡 トリガーにするブランチ名

permissions:
  id-token: write # 💡 OIDC認証を使うために必須の権限ですsusu
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコード（script.pyなど）を取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. AWS への認証（アクセスキーなしの OIDC 方式）
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::568601941391:role/20260615deploy
          aws-region: ap-northeast-1

      # 3. script.py を zip 化して Lambda にアップロード（新バージョンを発行）
      - name: Upload Code to Lambda and Publish Version
        id: publish_lambda
        run: |
          zip -j function.zip script.py
          
          # 新しく作られたバージョン番号を取得（例: 8）
          NEW_VER=$(aws lambda update-function-code \
            --function-name lambda_codedeploy \
            --zip-file fileb://function.zip \
            --publish \
            --query 'Version' \
            --output text)
          
          echo "NEW_VERSION=$NEW_VER" >> $GITHUB_ENV

      # 4. AWS CLIで CodeDeploy を実行する前に appspec.yml を動的更新
      - name: Deploy to AWS CodeDeploy via CLI
        run: |
          # AWSから、現在 prod エイリアスが指している旧バージョン番号を取得（例: 7）
          CURRENT_VER=$(aws lambda get-alias \
            --function-name lambda_codedeploy \
            --name prod \
            --query 'FunctionVersion' \
            --output text)
          
          # appspec.yml の CurrentVersion と TargetVersion を自動で最新値に置換
          python3 -c "
          import re
          with open('appspec.yml', 'r') as f:
              content = f.read()
          content = re.sub(r'CurrentVersion: .*', f'CurrentVersion: \"${CURRENT_VER}\"', content)
          content = re.sub(r'TargetVersion: .*', 'TargetVersion: \"${{ env.NEW_VERSION }}\"', content)
          with open('appspec.yml', 'w') as f:
              f.write(content)
          "
          
          # appspec.yml を JSON 化して CodeDeploy へ送信
          CONTENT=$(jq -sR . appspec.yml)
          
          aws deploy create-deployment \
            --application-name lamlam-test-20260427 \
            --deployment-group-name LamLamtest-20260507-2 \
            --revision "{\"revisionType\": \"AppSpecContent\", \"appSpecContent\": {\"content\": $CONTENT}}"