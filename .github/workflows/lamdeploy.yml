name: Deploy Lambda via CodeDeploy

on:
  push:
    branches:
      - main # 💡 トリガーにするブランチ名

permissions:
  id-token: write # 💡 OIDC認証を使うために必須の権限ですsusu
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. リポジトリのコード（script.pyなど）を取得
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. AWS への認証（アクセスキーなしの OIDC 方式）
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 🟢 教えていただいた本物のロール名を指定しました
          role-to-assume: arn:aws:iam::568601941391:role/20260615deploy
          aws-region: ap-northeast-1
      # 3. script.py を zip に固めて Lambda の新バージョンを発行
      - name: Upload Code to Lambda and Publish Version
        id: publish_lambda
        run: |
          zip -j function.zip script.py
          
          VERSION=$(aws lambda update-function-code \
            --function-name lambda_codedeploy \
            --zip-file fileb://function.zip \
            --publish \
            --query 'Version' \
            --output text)
          
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      # 4. AWS CLIでCodeDeployのデプロイを直接実行する
      - name: Deploy to AWS CodeDeploy via CLI
        run: |
          # appspec.yml の TargetVersion を最新バージョンに自動更新
          sed -i "s/TargetVersion: .*/TargetVersion: \"${{ env.NEW_VERSION }}\"/" appspec.yml
          
          # appspec.yml の内容を安全に改行文字（\n）へ変換して JSON を作成
          CONTENT=$(jq -sR . appspec.yml)
          
          # AWS CLI でデプロイを実行
          aws deploy create-deployment \
            --application-name deploy-serverless \
            --deployment-group-name deploy-group \
            --revision "{\"revisionType\": \"AppSpecContent\", \"appSpecContent\": {\"content\": $CONTENT}}"